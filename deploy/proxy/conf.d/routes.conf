map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

# DNS interno do Docker; reconsulta IPs após recriar os containers.
resolver 127.0.0.11 valid=10s ipv6=off;
server_tokens off;

server {
    listen 80 default_server;
    server_name _;
    return 444;
}
server {
    listen 80;
    server_name agenda.emitech.com.br ns.emitech.com.br;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
}
server {
    listen 443 ssl;
    server_name agenda.emitech.com.br;
    include /etc/nginx/snippets/tls.conf;
    location / {
        set $agenda_upstream agenda-web:80;
        proxy_pass http://$agenda_upstream;
        include /etc/nginx/snippets/proxy.conf;
    }
}
server {
    listen 443 ssl;
    server_name ns.emitech.com.br;
    include /etc/nginx/snippets/tls.conf;
    location / {
        default_type text/plain;
        add_header Retry-After 3600 always;
        return 503 "SaaS NS ainda nao implantado.\n";
    }
}
